name: Failing CI Test

on:
  push:
  pull_request:
permissions: 
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install nonexistent-package-xyz==90.99.99

      - name: Run tests
        run: python -c "import nonexistent_module"
  
  explain_failure:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain failure (Gemini)
        id: explain
        uses: gopalcnepal/explain-ci@v1.0.1
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          provider: gemini
          model: gemini-3-flash-preview
      - name: Log explanation outcome
        if: always()
        run: |
          echo "Explanation: ${{ steps.explain.outputs.explanation_markdown }}"
          echo "Posted to: ${{ steps.explain.outputs.comment_target }}"
          echo "PR Number: ${{ steps.explain.outputs.pr_number }}"
