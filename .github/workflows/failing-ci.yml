name: Failing CI Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install nonexistent-package-xyz==90.99.99

      - name: Run tests
        run: python -c "import nonexistent_module"

      - name: Explain failure (Gemini)
        if: failure()
        uses: gopalcnepal/ai-ci-error-explainer@v1
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          provider: gemini
          model: gemini-3-flash-preview
